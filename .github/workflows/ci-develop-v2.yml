name: Vérifications develop-V2

on:
  pull_request:
    branches:
      - develop-V2
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-develop-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Backend et frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kerno_ci
          POSTGRES_PASSWORD: kerno_ci
          POSTGRES_DB: kerno_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kerno_ci -d kerno_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      DATABASE_URL: postgresql://kerno_ci:kerno_ci@localhost:5432/kerno_ci?schema=public

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Vérifier le diff de la pull request
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Configurer Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Configurer Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Configurer npm
        run: npm install --global npm@10.9.8

      - name: Vérifier les versions
        shell: bash
        run: |
          expected_node="v$(cat .nvmrc)"
          actual_node="$(node --version)"
          actual_npm="$(npm --version)"

          test "$actual_node" = "$expected_node"
          test "$actual_npm" = "10.9.8"

          echo "Node.js : $actual_node"
          echo "npm : $actual_npm"
          echo "Python : $(python --version)"

      - name: Installer les dépendances racine
        run: npm ci

      - name: Installer les dépendances backend
        run: npm ci --prefix backend

      - name: Installer les dépendances frontend
        run: npm ci --prefix frontend

      - name: Installer les dépendances pytest API
        run: python -m pip install pytest requests

      - name: Installer le client PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Appliquer les migrations Prisma sur PostgreSQL CI
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Vérifier sauvegarde et restauration PostgreSQL
        env:
          ALLOW_BACKUP_RESTORE_PROBE: "true"
          PG_SOURCE_URL: postgresql://kerno_ci:kerno_ci@localhost:5432/kerno_ci
          PG_ADMIN_URL: postgresql://kerno_ci:kerno_ci@localhost:5432/postgres
          PG_RESTORE_DB: kerno_ci_restore
          PG_RESTORE_URL: postgresql://kerno_ci:kerno_ci@localhost:5432/kerno_ci_restore
        run: bash scripts/verify-postgres-backup-restore.sh

      - name: Démarrer l'API KERNO pour le jeu d'essai RNCP
        env:
          PORT: "5001"
          JWT_SECRET: kerno-ci-rncp5-secret-not-for-production
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:5173
          AUTH_COOKIE_SAMESITE: lax
          ENABLE_API_DOCS: "true"
        run: |
          npm start --prefix backend > /tmp/kerno-api.log 2>&1 &
          echo $! > /tmp/kerno-api.pid

          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:5001/api/health >/dev/null; then
              echo "KERNO API ready for representative RNCP test."
              exit 0
            fi
            sleep 1
          done

          cat /tmp/kerno-api.log
          exit 1

      - name: Exécuter le jeu d'essai métier RNCP
        env:
          KERNO_API_BASE_URL: http://127.0.0.1:5001
          KERNO_PYTEST_RESULTS_FILE: backend/tests/results/rncp_representative_test_results.json
        run: |
          python -m pytest backend/tests/test_kerno_api_comprehensive.py -k "request" -q
          cat backend/tests/results/rncp_representative_test_results.json

      - name: Archiver le résultat du jeu d'essai RNCP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rncp-representative-test-results
          path: backend/tests/results/rncp_representative_test_results.json
          if-no-files-found: warn
          retention-days: 30

      - name: Arrêter l'API KERNO de test
        if: always()
        run: |
          if [[ -f /tmp/kerno-api.pid ]]; then
            kill "$(cat /tmp/kerno-api.pid)" 2>/dev/null || true
          fi

      - name: Tester le backend
        run: npm test --prefix backend

      - name: Vérifier le lint frontend
        run: npm run lint --prefix frontend

      - name: Construire le frontend
        run: npm run build --prefix frontend
